name: Repair Spanish form checks

on:
  push:
    branches: [copilot/fix-spanish-form-heading-20261114]

permissions:
  contents: read

jobs:
  local-checks:
    if: github.event.repository.private == false && github.ref == 'refs/heads/copilot/fix-spanish-form-heading-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout repair branch without stored credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 22 without installing project dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact repair content and test-only change
        shell: bash
        run: |
          set -euo pipefail
          base=4caa5295d916a34849b06706236f4cf27c641c8d
          git merge-base --is-ancestor "$base" HEAD
          test "$(git diff --name-only "$base" HEAD)" = '.github/workflows/repair-spanish-form-check.yml'
      - name: Syntax checks with no network or inherited environment
        run: |
          sudo unshare --net -- env -i PATH="$PATH" node --check locales/repair-plain.mjs
          sudo unshare --net -- env -i PATH="$PATH" node --check es/form-i18n.js
          sudo unshare --net -- env -i PATH="$PATH" node --check tools/build-locales.mjs
      - name: Existing local locale and content regression tests offline
        if: always()
        run: sudo unshare --net -- env -i PATH="$PATH" node --test tools/test-locales.mjs tools/test-content-consistency.mjs
      - name: Isolated generator consistency and original-baseline comparison
        if: always()
        shell: node {0}
        run: |
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const os = require('node:os');
          const {spawnSync, execFileSync} = require('node:child_process');
          const original = '0dddc1c0b13da719f8001a951d055959cb892d3e';
          const files = ['locales/repair-plain.mjs','es/form-i18n.js','es/reparaturanfrage.html'];
          const read = (dir,file) => fs.readFileSync(path.join(dir,file),'utf8');
          const dictionary = text => JSON.parse(text.slice('window.siteTranslate=(key)=>('.length).split(')[key]||key;')[0]);
          const sorted = obj => JSON.stringify(Object.fromEntries(Object.entries(obj).sort(([a],[b]) => a.localeCompare(b))));
          const keys = [
            'Was darf ich für Sie reparieren?',
            'Ihre Reparaturanfrage wurde übermittelt. Ich melde mich schnellstmöglich bei Ihnen.',
            'PIN / Passwort',
            'Ich bespreche Prüfung, Kosten und Reparatur mit Ihnen. Kostenpflichtige Arbeiten nur nach Ihrer Freigabe.',
            'Zahlung erst nach Vereinbarung: per SEPA-Echtzeitüberweisung. Ersatzteile bestelle ich nach Zahlungseingang. Abholung nach vollständiger Bezahlung.',
            'Bitte sichern Sie Ihre Daten vor der Abgabe. Eine erfolgreiche Datenrettung kann ich nicht garantieren.',
            'Für die Online-Reparaturanfrage ist JavaScript erforderlich. Bitte aktivieren Sie JavaScript oder rufen Sie mich unter',
            'an. So kann ich die Geräteangaben gemeinsam vollständig erfassen.'
          ];
          const expected = dictionary(read('.',files[1]));
          assert.equal(expected[keys[0]], '¿Qué necesita reparar?');
          const verifyRepair = dir => {
            const map = dictionary(read(dir,files[1]));
            const html = read(dir,files[2]);
            for (const key of keys) {
              assert.ok(expected[key] && expected[key] !== key, 'Missing committed alias: '+key);
              assert.equal(map[key],expected[key], 'Generated alias changed: '+key);
              assert.ok(html.includes(expected[key]), 'HTML translation missing: '+key);
            }
            assert.match(html, /<h2 id="request-form-title">¿Qué necesita reparar\?<\/h2>/);
            assert.match(html, /<div class="form-success" data-form-success hidden/);
            console.log('Eight repair translations and hidden success state verified: '+dir.split(path.sep).pop());
          };
          verifyRepair('.');
          let failed = false;
          for (const [label,ref] of [['repair','HEAD'],['original-baseline',original]]) {
            const dir = fs.mkdtempSync(path.join(os.tmpdir(),'spanish-'+label+'-'));
            const archive = execFileSync('git',['archive','--format=tar',ref],{maxBuffer:128*1024*1024});
            const unpack = spawnSync('tar',['-xf','-','-C',dir],{input:archive});
            assert.equal(unpack.status,0,'Temporary archive extraction failed');
            const before = Object.fromEntries(files.map(file => [file,read(dir,file)]));
            const args = ['unshare','--net','--','env','-i','PATH='+process.env.PATH,process.execPath,'tools/build-locales.mjs'];
            const build = spawnSync('sudo',args,{cwd:dir,encoding:'utf8',timeout:60000,maxBuffer:4*1024*1024});
            console.log(label+' generator exit: '+build.status);
            console.log(build.stdout || '');
            if (build.status !== 0) { console.log(build.stderr || 'Generator did not complete'); failed=true; continue; }
            for (const file of files) console.log(label+' byte-identical '+file+': '+(before[file]===read(dir,file)));
            const oldMap=dictionary(before[files[1]]), newMap=dictionary(read(dir,files[1]));
            const changedKeys=[...new Set([...Object.keys(oldMap),...Object.keys(newMap)])].filter(key=>oldMap[key]!==newMap[key]);
            console.log(label+' dictionary semantic changes: '+JSON.stringify(changedKeys));
            const text = html => html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
            const a=text(before[files[2]]),b=text(read(dir,files[2]));
            console.log(label+' HTML text-identical: '+(a===b));
            if(a!==b){let i=0;while(i<Math.min(a.length,b.length)&&a[i]===b[i])i++;console.log(label+' first text drift before: '+a.slice(Math.max(0,i-80),i+500));console.log(label+' first text drift after: '+b.slice(Math.max(0,i-80),i+500));}
            if(label==='repair'){
              try { verifyRepair(dir); assert.equal(sorted(oldMap),sorted(newMap),'Generator dictionary semantic drift'); assert.equal(a,b,'Generator HTML text drift remains'); }
              catch(error){console.log(error.message);failed=true;}
            } else {
              const tests=spawnSync('sudo',['unshare','--net','--','env','-i','PATH='+process.env.PATH,process.execPath,'--test','tools/test-locales.mjs','tools/test-content-consistency.mjs'],{cwd:dir,encoding:'utf8',timeout:60000,maxBuffer:4*1024*1024});
              console.log('Original baseline tests after generator exit: '+tests.status);console.log(tests.stdout||'');console.log(tests.stderr||'');
            }
          }
          console.log('No files copied back, committed, pushed or deployed. No dependencies installed. Full npm test and validate not run by this bounded workflow.');
          if(failed)process.exitCode=1;
