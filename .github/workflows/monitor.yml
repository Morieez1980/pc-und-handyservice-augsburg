name: Pages deployment monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# GitHub-hosted runners are challenged by Bot Fight Mode on the custom domain.
# The Cloudflare cron Worker checks the public domain separately.
env:
  MONITOR_BASE: https://pc-und-handyservice-augsburg.pages.dev

concurrency:
  group: production-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Wait for current deployment and check endpoints
        shell: node {0}
        run: |
          const assert = require('node:assert/strict');
          const {readFileSync} = require('node:fs');
          // BEGIN DEPLOYMENT READINESS: compare references, not potentially transformed HTML bytes.
          const endpoints = ['/', '/apps', '/apps-lizenz', '/apps-legal.css', '/app-offer.json', '/api/google-reviews', '/api/review-summary', '/reparaturanfrage', '/reparaturberichte', '/datenschutz', '/impressum.html', '/qr-reparaturanfrage.png?v=20260902-1', '/robots.txt', '/sitemap.xml', '/site.webmanifest', '/og-image.png', '/icon-192.png', '/clarity-consent.min.js', '/repair-form.js', '/vendor/intl-tel-input/css/intlTelInput.min.css', '/vendor/intl-tel-input/js/intlTelInputWithUtils.min.js', '/vendor/intl-tel-input/img/flags.webp', '/vendor/intl-tel-input/img/flags@2x.webp'];
          function assetRef(value, route = '/') {
            const url = new URL(value.replace(/&amp;/g, '&'), new URL(route, 'https://deployment.invalid'));
            assert.equal(url.origin, 'https://deployment.invalid', `Unexpected frontend asset origin: ${value}`);
            return url.pathname + url.search;
          }
          function versionedRefs(html, route) {
            const refs = [];
            for (const tag of html.matchAll(/<(?:script|link)\b[^>]*>/gi)) {
              if (/^<link\b/i.test(tag[0]) && !/\brel\s*=\s*["']stylesheet["']/i.test(tag[0])) continue;
              const value = tag[0].match(/\b(?:src|href)\s*=\s*["']([^"']+)["']/i)?.[1];
              if (!value || /^(?:https?:)?\/\//i.test(value)) continue;
              const ref = assetRef(value, route), url = new URL(ref, 'https://deployment.invalid');
              if (/\.(?:js|css)$/.test(url.pathname) && url.searchParams.has('v')) refs.push(ref);
            }
            return [...new Set(refs)].sort();
          }
          function portraits(html) {
            return [...new Set([...html.matchAll(/class=["']repair-avatar["'][^>]*>\s*<img\b[^>]*\bsrc=["']([^"']+)["']/gi)].map(match => assetRef(match[1])))].sort();
          }
          function spriteRef(source) {
            const value = source.match(/sprite\.src\s*=\s*["']([^"']+)["']/)?.[1];
            assert.ok(value, 'Avatar script sprite reference missing');
            return assetRef(value);
          }
          function cssRefs(source, route) {
            return [...new Set([...source.matchAll(/url\(\s*["']?([^\s"')]+)["']?\s*\)/g)].map(match => assetRef(match[1], route)))].sort();
          }
          function expectedDeployment(readFile) {
            const pages = [{route: '/', file: 'index.html'}, {route: '/apps', file: 'apps.html'}].map(page => ({...page, refs: versionedRefs(readFile(page.file), page.route)}));
            const home = readFile('index.html'), portraitRefs = portraits(home);
            assert.ok(portraitRefs.length, 'Checked-out homepage portrait reference missing');
            const helper = pages[0].refs.find(ref => ref.startsWith('/repair-helper.js?'));
            const scene = pages[0].refs.find(ref => ref.startsWith('/repair-work-scene.js?'));
            const css = pages[0].refs.find(ref => ref.startsWith('/home-intro.css?'));
            assert.ok(helper && scene && css && pages[1].refs.length, 'Checked-out frontend references missing');
            const sprite = spriteRef(readFile(new URL(helper, 'https://deployment.invalid').pathname.slice(1)));
            const sceneSource = readFile(new URL(scene, 'https://deployment.invalid').pathname.slice(1)).replace(/\r\n/g, '\n').trim();
            const cssSource = readFile(new URL(css, 'https://deployment.invalid').pathname.slice(1)).replace(/\r\n/g, '\n').trim();
            const spriteCss = cssRefs(cssSource, css);
            assert.ok(sceneSource.includes(sprite), 'Checked-out controller and work scene use different backgrounds');
            return {pages, portraitRefs, helper, scene, sceneSource, css, cssSource, sprite, spriteCss};
          }
          async function checkDeployment(expected, read) {
            const [home, apps, request] = await Promise.all(['/', '/apps', '/reparaturanfrage'].map(path => read(path, true)));
            for (const [page, html] of [[expected.pages[0], home], [expected.pages[1], apps]]) {
              const refs = versionedRefs(html, page.route);
              for (const ref of page.refs) assert.ok(refs.includes(ref), `${page.route}: waiting for current frontend reference ${ref}`);
            }
            assert.deepEqual(portraits(home), expected.portraitRefs, 'Homepage is waiting for the current avatar portrait');
            assert.ok(home.includes('script.min.js?v='), 'Homepage script marker missing');
            assert.ok(request.includes('repair-form.js?v='), 'Repair form script marker missing');
            assert.ok(apps.includes('id="app-enquiry"') && apps.includes('id="app-idea"'), 'App enquiry markers missing');
            const alreadyRead = new Set(['/', '/apps', '/reparaturanfrage']);
            const [helper, css, scene] = await Promise.all([
              read(expected.helper, true), read(expected.css, true), read(expected.scene, true),
              ...endpoints.filter(path => !alreadyRead.has(path)).map(path => read(path, false))
            ]);
            assert.equal(spriteRef(helper), expected.sprite, 'Avatar script is waiting for the current sprite');
            assert.deepEqual(cssRefs(css, expected.css), expected.spriteCss, 'Avatar CSS is waiting for the current sprite');
            assert.equal(css.replace(/\r\n/g, '\n').trim(), expected.cssSource, 'Avatar CSS is waiting for the current work-scene styles');
            assert.equal(scene.replace(/\r\n/g, '\n').trim(), expected.sceneSource, 'Avatar is waiting for the current articulated work scene');
          }
          async function waitForDeployment(check, {now, sleep, log, budgetMs = 150000, pollMs = 8000}) {
            const deadline = now() + budgetMs;
            let lastError, attempt = 0;
            while (now() < deadline) {
              attempt++;
              try {
                await check(deadline);
                return attempt;
              } catch (error) {
                lastError = error;
                log(`Deployment not current yet (attempt ${attempt}): ${error.message}`);
              }
              const remaining = deadline - now();
              if (remaining > 0) await sleep(Math.min(pollMs, remaining));
            }
            throw new Error(`Current deployment did not become ready within ${budgetMs / 1000}s: ${lastError?.message || 'deadline reached'}`);
          }
          // END DEPLOYMENT READINESS
          const base = new URL(process.env.MONITOR_BASE);
          const expected = expectedDeployment(file => readFileSync(file, 'utf8'));
          waitForDeployment(async deadline => {
            await checkDeployment(expected, async (path, text) => {
              const url = new URL(path, base);
              assert.equal(url.origin, base.origin, `Unexpected asset origin: ${url}`);
              const timeout = Math.min(6000, Math.max(1, deadline - Date.now()));
              const response = await fetch(url, {headers: {'cache-control': 'no-cache'}, signal: AbortSignal.timeout(timeout)});
              assert.equal(response.status, 200, `${path}: HTTP ${response.status}`);
              if (text) return response.text();
              await response.body?.cancel();
            });
          }, {now: Date.now, sleep: ms => new Promise(resolve => setTimeout(resolve, ms)), log: console.log})
            .then(attempts => console.log(`Current deployment is ready after attempt ${attempts}.`))
            .catch(error => {console.error(error.message); process.exitCode = 1;});

      - name: Check security and cache headers
        shell: bash
        run: |
          set -euo pipefail
          base="${MONITOR_BASE}"
          headers="$(curl --silent --show-error --head --location --retry 3 "${base}/")"
          for header in strict-transport-security content-security-policy x-content-type-options referrer-policy permissions-policy; do
            if ! grep --ignore-case --quiet "^${header}:" <<< "$headers"; then
              echo "Missing security header: ${header}"
              exit 1
            fi
          done
          asset_headers="$(curl --silent --show-error --head --location --retry 3 "${base}/styles.min.css?v=20260715-2")"
          if ! grep --ignore-case --quiet '^cache-control:.*max-age=31536000.*immutable' <<< "$asset_headers"; then
            echo "Versioned production assets are not cached immutably"
            exit 1
          fi
          image_headers="$(curl --silent --show-error --head --location --retry 3 "${base}/og-image.png")"
          if ! grep --ignore-case --quiet '^cache-control:.*max-age=86400' <<< "$image_headers"; then
            echo "Stable social and app images do not use the intended revalidation policy"
            exit 1
          fi

      - name: Check production content
        shell: bash
        run: |
          set -euo pipefail
          page="$(curl --silent --show-error --location --retry 3 "${MONITOR_BASE}/")"
          for marker in 'PC & Handyservice Augsburg' 'site.webmanifest?v=' 'script.min.js?v=' 'og:image' 'application/ld+json' 'clarity-consent.min.js?v='; do
            if ! grep --fixed-strings --quiet "$marker" <<< "$page"; then
              echo "Missing production marker: ${marker}"
              exit 1
            fi
          done

      - name: Check production repair form
        shell: bash
        run: |
          set -euo pipefail
          page="$(curl --silent --show-error --location --retry 3 "${MONITOR_BASE}/reparaturanfrage")"
          for marker in 'id="repair-request"' 'id="pipeline-email"' 'name="POTENTIALCF5"' 'name="POTENTIALCF6"' 'name="POTENTIALCF7"' 'name="Contacts.Mobile"' 'class="phone-control"' 'action="https://bigin.zoho.eu/crm/WebForm"' 'class="bigin-response-frame"' 'Für die Online-Reparaturanfrage ist JavaScript erforderlich' 'request.css?v=' 'repair-form.js?v=' 'vendor/intl-tel-input/css/intlTelInput.min.css?v=29.2.3' 'vendor/intl-tel-input/js/intlTelInputWithUtils.min.js?v=29.2.3'; do
            if ! grep --fixed-strings --quiet "$marker" <<< "$page"; then
              echo "Missing repair-form marker: ${marker}"
              exit 1
            fi
          done
          if grep --fixed-strings --quiet 'https://eu.bigin.online/org20117040394/forms/reparatur-online-anfragen' <<< "$page"; then
            echo "Outdated Bigin fallback is still linked in production"
            exit 1
          fi
          script="$(curl --silent --show-error --location --retry 3 "${MONITOR_BASE}/repair-form.js")"
          for marker in 'pipeline-email' 'intlTelInput' 'isValidNumber' 'getNumber'; do
            if ! grep --fixed-strings --quiet "$marker" <<< "$script"; then
              echo "Repair form script is missing marker: ${marker}"
              exit 1
            fi
          done
          if grep --fixed-strings --quiet 'crmWebToEntityForm' <<< "$page"; then
            echo "Legacy Zoho CRM form is still present in production"
            exit 1
          fi

      - name: Check app hub and avatar asset contents
        shell: node {0}
        run: |
          const assert = require('node:assert/strict');
          const {Script} = require('node:vm');
          const base = new URL(process.env.MONITOR_BASE);
          async function read(path, mime) {
            const url = new URL(path, base);
            assert.equal(url.origin, base.origin, `Unexpected asset origin: ${url}`);
            const response = await fetch(url, {signal: AbortSignal.timeout(20000)});
            assert.equal(response.status, 200, `${path}: HTTP ${response.status}`);
            assert.match(response.headers.get('content-type') || '', mime, `${path}: unexpected content type`);
            return Buffer.from(await response.arrayBuffer());
          }
          function linked(html, pattern, label) {
            const match = html.match(pattern);
            assert.ok(match, `${label}: link missing from production HTML`);
            return match[1];
          }
          // BEGIN APP DOWNLOAD GATE PROBE: run the delivered script with inert form/network adapters.
          async function observeDownloadGate(source, html, offer) {
            const tag = html.match(/<a\b[^>]*\bdata-demo-download\b[^>]*>/i)?.[0];
            assert.ok(tag, 'Demo download control missing');
            const attributes = new Map([...tag.slice(2, -1).matchAll(/([^\s=/>]+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+)))?/g)].map(m => [m[1].toLowerCase(), m[2] ?? m[3] ?? m[4] ?? '']));
            const initialHref = attributes.get('href') || '';
            const clicks = [];
            const link = {
              get href() { return attributes.get('href') || ''; },
              set href(value) { attributes.set('href', String(value)); },
              getAttribute(name) { return attributes.get(name) ?? null; },
              removeAttribute(name) { attributes.delete(name); },
              addEventListener(type, handler) { if (type === 'click') clicks.push(handler); }
            };
            const notices = [...html.matchAll(/\bdata-preview-notice\b/g)].map(() => ({removed: false, remove() { this.removed = true; }}));
            const status = {textContent: ''};
            let requests = 0;
            const document = {
              body: {dataset: {}},
              querySelector(selector) { return selector === '[data-demo-download]' ? link : selector === '#download-status' ? status : null; },
              querySelectorAll(selector) {
                if (selector === '[data-preview-notice]') return notices;
                if (selector === 'a[aria-disabled=true]') return link.getAttribute('aria-disabled') === 'true' ? [link] : [];
                return [];
              }
            };
            new Script(source, {filename: 'production-apps.js'}).runInNewContext({document, URL, URLSearchParams, location: {search: ''}, navigator: {}, fetch: async path => {
              assert.equal(path, '/app-offer.json', 'Unexpected request from app download probe');
              requests++;
              return {ok: true, json: async () => offer};
            }}, {timeout: 1000});
            await new Promise(resolve => setImmediate(resolve));
            assert.equal(requests, 1, 'App script did not request its download configuration');
            let clickPrevented = false;
            for (const handler of clicks) handler({preventDefault() { clickPrevented = true; }});
            return {href: link.href, initialHref, disabled: link.getAttribute('aria-disabled'), notices: notices.map(n => n.removed), clickPrevented, status: status.textContent};
          }
          async function verifyDownloadGate(source, html, offer) {
            const state = await observeDownloadGate(source, html, offer);
            const released = offer.published === true && offer.legalReviewComplete === true && offer.practicalAcceptanceComplete === true;
            if (released) {
              let target;
              try { target = new URL(offer.demo.url); } catch { /* Report the configuration failure below. */ }
              assert.ok(target && target.protocol === 'https:' && !target.username && !target.password, 'Released demo URL must be valid HTTPS without credentials');
              assert.equal(state.href, target.href, 'Released demo control has the wrong target');
              assert.equal(state.disabled, null, 'Released demo control is still disabled');
              assert.equal(state.clickPrevented, false, 'Released demo click is still blocked');
              assert.ok(state.notices.every(removed => removed), 'Released preview notice was not removed');
            } else {
              assert.equal(offer.demo.url, null, 'Unreleased demo URL must remain unset');
              assert.equal(offer.purchaseDownloadUrl, null, 'Unreleased purchase URL must remain unset');
              assert.equal(state.href, state.initialHref, 'Unreleased demo target changed');
              assert.equal(state.disabled, 'true', 'Unreleased demo control is not disabled');
              assert.equal(state.clickPrevented, true, 'Unreleased demo click is not blocked');
              assert.ok(state.notices.every(removed => !removed), 'Unreleased preview notice was removed');
            }
          }
          // END APP DOWNLOAD GATE PROBE
          async function check() {
            const [homeBytes, appBytes, licenseBytes] = await Promise.all([read('/', /^text\/html\b/i), read('/apps', /^text\/html\b/i), read('/apps-lizenz', /^text\/html\b/i)]);
            const home = homeBytes.toString(), apps = appBytes.toString(), license = licenseBytes.toString();
            for (const marker of ['id="app-enquiry"', 'id="app-idea"', 'data-demo-download']) assert.ok(apps.includes(marker), `App hub marker missing: ${marker}`);
            assert.ok(home.includes('data-repair-helper'), 'Avatar contact control missing');
            const appPath = linked(apps, /src=["'](\/(?:apps|app-hub)\.js(?:\?[^"']*)?)["']/, 'App script');
            const appCssPath = linked(apps, /href=["'](\/apps\.css(?:\?[^"']*)?)["']/, 'App stylesheet');
            const legalCssPath = linked(license, /href=["'](\/apps-legal\.css(?:\?[^"']*)?)["']/, 'License stylesheet');
            for (const id of ['lizenz', 'produkt', 'widerruf', 'datenschutz', 'sicherheit', 'urheberrecht']) assert.ok(license.includes(`id="${id}"`), `License section missing: ${id}`);
            for (const document of ['lizenzbedingungen', 'produktinformationen', 'widerruf', 'datenschutz', 'datensicherheit']) assert.ok(license.includes(`/assets/apps/keil-copy/${document}.txt`), `Original document link missing: ${document}`);
            const helperPath = linked(home, /src=["'](\/repair-helper\.js(?:\?[^"']*)?)["']/, 'Avatar script');
            const scenePath = linked(home, /src=["'](\/repair-work-scene\.js(?:\?[^"']*)?)["']/, 'Avatar work scene');
            const cssPath = linked(home, /href=["'](\/home-intro\.css(?:\?[^"']*)?)["']/, 'Avatar stylesheet');
            const jsMime = /^(?:application|text)\/javascript\b/i;
            const [appJs, helperJs, cssBytes, offerBytes, appCss, legalCss] = await Promise.all([read(appPath, jsMime), read(helperPath, jsMime), read(cssPath, /^text\/css\b/i), read('/app-offer.json', /^application\/json\b/i), read(appCssPath, /^text\/css\b/i), read(legalCssPath, /^text\/css\b/i)]);
            const app = appJs.toString(), helper = helperJs.toString(), css = cssBytes.toString();
            const scene = (await read(scenePath, jsMime)).toString();
            for (const [path, source] of [[appPath, app], [helperPath, helper], [scenePath, scene]]) new Script(source, {filename: path});
            for (const marker of ['#app-enquiry', '#app-idea', 'app-offer.json', 'data-demo-download', 'practicalAcceptanceComplete']) assert.ok(app.includes(marker), `App script marker missing: ${marker}`);
            for (const marker of ['data-repair-helper', 'canAnimate', 'prefers-reduced-motion', 'pageshow', 'motionOptIn']) assert.ok(helper.includes(marker), `Avatar script marker missing: ${marker}`);
            assert.ok(scene.includes("const duration = '12s'") && scene.includes('repeatCount="indefinite"'), 'Continuous component-exchange timeline missing');
            for (const marker of ['pauseAnimations', 'unpauseAnimations', 'repair-held-old', 'repair-held-new', 'repair-installed-component']) assert.ok(scene.includes(marker), `Work-scene marker missing: ${marker}`);
            assert.ok(css.includes('.repair-working-avatar.rig-ready'), 'Ready work-scene styling missing');
            assert.ok(appCss.toString().includes('.app-page'), 'App stylesheet marker missing');
            assert.ok(legalCss.toString().includes('.legal-document'), 'License stylesheet marker missing');
            const offer = JSON.parse(offerBytes.toString());
            assert.equal(offer.product, 'Keil@Copy', 'Unexpected app offer');
            for (const flag of ['published', 'legalReviewComplete', 'practicalAcceptanceComplete']) assert.equal(typeof offer[flag], 'boolean', `App offer flag missing: ${flag}`);
            assert.ok(offer.demo && Object.hasOwn(offer.demo, 'url') && Object.hasOwn(offer, 'purchaseDownloadUrl'), 'Download gate fields missing');
            await verifyDownloadGate(app, apps, offer);
            const sprite = linked(helper, /sprite\.src\s*=\s*["']([^"']+)["']/, 'Avatar sprite');
            assert.ok(scene.includes(sprite), 'Avatar controller and work scene use different backgrounds');
            const portrait = linked(home, /class=["']repair-avatar["'][^>]*>\s*<img[^>]*src=["']([^"']+)["']/, 'Avatar portrait');
            for (const path of [sprite, portrait]) {
              const webp = /\.webp(?:\?|$)/i.test(path);
              const bytes = await read(path, webp ? /^image\/webp\b/i : /^image\/png\b/i);
              assert.ok(bytes.length >= 24 && (webp ? bytes.subarray(0, 4).toString() === 'RIFF' && bytes.subarray(8, 12).toString() === 'WEBP' : bytes.subarray(0, 8).equals(Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]))), `${path}: invalid avatar image signature`);
              const maxBytes = path === sprite ? 384 * 1024 : 64 * 1024;
              assert.ok(bytes.length <= maxBytes, `${path}: avatar asset exceeds ${maxBytes} bytes`);
            }
            console.log('App hub, license page, JavaScript syntax, release gates and avatar assets passed. Browser interaction is covered separately.');
          }
          check().catch(error => { console.error(error); process.exitCode = 1; });

      - name: Check APIs and invalid confirmation
        shell: bash
        run: |
          set -euo pipefail
          base="${MONITOR_BASE}"
          reviews="$(curl --silent --show-error --location --retry 3 "${base}/api/google-reviews")"
          summary="$(curl --silent --show-error --location --retry 3 "${base}/api/review-summary")"
          if ! grep --extended-regexp --quiet '"source":"(google-business-profile|temporarily-unavailable)"' <<< "$reviews"; then
            echo "Google reviews API returned an unexpected source"
            exit 1
          fi
          if ! grep --extended-regexp --quiet '"source":"(google-business-profile|google-places|verified-fallback)"' <<< "$summary"; then
            echo "Review summary returned an unexpected source"
            exit 1
          fi
          invalid_code="$(curl --silent --show-error --location --retry 3 --output /dev/null --write-out '%{http_code}' "${base}/anfrage-bestaetigt?ref=ungueltig")"
          if [[ "$invalid_code" != "400" ]]; then
            echo "Invalid confirmation reference was not rejected with HTTP 400"
            exit 1
          fi

