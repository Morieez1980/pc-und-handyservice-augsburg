<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402" font-family="Arial,Helvetica,sans-serif" fill="#102b4d" role="img" aria-labelledby="title desc">
  <title id="title">So finden Sie den Hauseingang im Hof</title>
  <desc id="desc">Von der Stätzlinger Straße links über die Eppaner Straße am großen weißen Gebäude entlang, dann rechts durch die Hofmitte zum Hauseingang. Der Zaun beginnt oben links am Hof, läuft bis zur Ecke, dort nach unten bis zur mittleren Querlinie und dann ohne Lücke nach rechts zum Außenzaun bei den beiden parkenden Autos. Rechts läuft der Zaun durchgehend nach unten weiter. Nur direkt am Zaun parallel kurz halten; der Weg zum Hauseingang bleibt frei. Die Zielbeschriftung steht oberhalb des Eingangs und zeigt mit einer Hinweislinie auf die Tür am großen Gebäude. Gebäude und Zaunverlauf sind schematisch nach Angaben des Inhabers dargestellt.</desc>
  <defs>
    <linearGradient id="roof" x2="0" y2="1"><stop stop-color="#2d587e"/><stop offset="1" stop-color="#1e3d5e"/></linearGradient>
    <pattern id="panels" width="24" height="28" patternUnits="userSpaceOnUse"><rect width="24" height="28" fill="url(#roof)"/><path d="M0 0H24M0 0V28" fill="none" stroke="#81a4bd" stroke-width="1" opacity=".6"/></pattern>
    <pattern id="fence" width="13" height="18" patternUnits="userSpaceOnUse"><path d="M6 0V18M0 5H13M0 14H13" stroke="#627c8a" stroke-width="2"/></pattern>
    <filter id="shadow" x="-.1" y="-.1" width="1.2" height="1.2"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#172d47" flood-opacity=".13"/></filter>
